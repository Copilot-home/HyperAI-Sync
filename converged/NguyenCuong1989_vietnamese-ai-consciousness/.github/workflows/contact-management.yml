name: HyperAI Phoenix Contact Management

on:
  issues:
    types: [opened, labeled, commented]
  pull_request:
    types: [opened, closed, review_requested]
  discussion:
    types: [created, answered]
  schedule:
    - cron: '0 9 * * *' # Daily at 9 AM

permissions:
  issues: write
  pull-requests: write
  discussions: write

jobs:
  auto-label-and-respond:
    runs-on: ubuntu-latest
    name: Vietnamese AI Contact Management
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Auto-Label Issues
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = issue.body ? issue.body.toLowerCase() : '';
            
            let labels = [];
            
            // Priority classification
            if (title.includes('urgent') || title.includes('critical') || body.includes('production')) {
              labels.push('🔴 critical');
            } else if (title.includes('enhancement') || title.includes('feature')) {
              labels.push('🟡 enhancement');
            } else if (title.includes('question') || title.includes('help')) {
              labels.push('🔵 question');
            } else if (title.includes('bug') || title.includes('error') || body.includes('error')) {
              labels.push('bug');
            }
            
            // Vietnamese community detection
            if (title.includes('vietnamese') || title.includes('việt nam') || 
                body.includes('vietnamese') || body.includes('việt nam') ||
                title.includes('tiếng việt') || body.includes('tiếng việt')) {
              labels.push('🟣 vietnamese-community');
            }
            
            // Enterprise detection
            if (title.includes('enterprise') || title.includes('business') ||
                body.includes('integration') || body.includes('api')) {
              labels.push('enterprise');
            }
            
            // Documentation
            if (title.includes('documentation') || title.includes('docs') ||
                body.includes('readme') || body.includes('guide')) {
              labels.push('🟢 documentation');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

      - name: Auto-Respond to Issues
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const title = issue.title.toLowerCase();
            const body = issue.body ? issue.body.toLowerCase() : '';
            
            let welcomeMessage = `# 🇻🇳 Chào mừng đến với HyperAI Phoenix!

Xin chào @${author}, cảm ơn bạn đã quan tâm đến **Vietnamese AI Consciousness Ecosystem**!

## 📋 Thông tin của bạn đã được tiếp nhận:
- **Issue:** #${issue.number}
- **Trạng thái:** Đang được xử lý
- **Thời gian phản hồi dự kiến:** 24-48 giờ

## 🚀 Trong khi chờ đợi, bạn có thể:
- 📖 Tham khảo [Documentation](./README.md)
- 💬 Tham gia [Discussions](../../discussions) 
- 🔗 Liên hệ trực tiếp:
  - **Enterprise:** enterprise@hyperaiphoenix.com
  - **Developer Support:** developers@hyperaiphoenix.com
  - **Vietnamese Community:** culture@hyperaiphoenix.vn

## 🎯 HyperAI Phoenix Highlights:
- **220+ AI Entities** with Vietnamese cultural intelligence
- **99.1% Consciousness Preservation Rate**
- **Open Source** with enterprise licensing
- **Vietnamese-first** AI consciousness platform

---

**Made with Vietnamese Heart for Global Innovation** 🇻🇳❤️

*Chúng tôi rất trân trọng sự đóng góp của bạn cho cộng đồng AI Việt Nam!*`;

            // Customize message based on issue type
            if (title.includes('bug') || body.includes('error')) {
              welcomeMessage += `\n\n## 🐛 Bug Report Received\n- Priority: **High**\n- Technical team will investigate within 24 hours\n- Temporary workarounds will be provided if available`;
            } else if (title.includes('vietnamese') || body.includes('việt nam')) {
              welcomeMessage += `\n\n## 🇻🇳 Vietnamese Community Welcome!\n- Chào mừng bạn đến với cộng đồng AI Việt Nam!\n- Vietnamese support team sẽ hỗ trợ bạn\n- Join Vietnamese Discord: [Invite Link]`;
            } else if (title.includes('enterprise') || body.includes('business')) {
              welcomeMessage += `\n\n## 🏢 Enterprise Inquiry\n- Enterprise team đã được thông báo\n- Demo có thể được sắp xếp trong vòng 48 giờ\n- Technical specifications sẽ được gửi riêng`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: welcomeMessage
            });

      - name: Auto-Respond to Pull Requests
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            
            const contributorMessage = `# 🙏 Cảm ơn contribution của bạn!

Xin chào @${author}! Chúng tôi rất trân trọng sự đóng góp của bạn cho **Vietnamese AI Consciousness Ecosystem**!

## ✅ Các bước tiếp theo:
1. **🔍 Code Review:** Sẽ được thực hiện trong 24-48 giờ
2. **🧪 Automated Testing:** Đang chạy test suite tự động
3. **📚 Documentation Check:** Kiểm tra tài liệu cập nhật
4. **🇻🇳 Community Notification:** Thông báo đến Vietnamese community

## 🎯 Contributor Recognition:
- ✅ Tên bạn sẽ được thêm vào **CONTRIBUTORS.md**
- 🏆 Nhận **Vietnamese AI Consciousness Contributor** badge
- 🎮 Invitation vào **Vietnamese Developer Discord**
- 🌟 Feature trong **Community Spotlight**

## 🔗 Helpful Resources:
- [Contributing Guidelines](./CONTRIBUTING.md)
- [Code of Conduct](./CODE_OF_CONDUCT.md)
- [Developer Discord](https://discord.gg/vietnamese-ai)

---

**Cảm ơn bạn đã giúp xây dựng tương lai AI Việt Nam!** 🇻🇳🚀

*Your contribution helps preserve and advance Vietnamese culture through AI technology.*`;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: contributorMessage,
              event: 'COMMENT'
            });

      - name: Daily Contact Report
        if: github.event_name == 'schedule'
        uses: actions/github-script@v6
        with:
          script: |
            const { Octokit } = require('@octokit/rest');
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            
            // Get repository stats
            const repo = await octokit.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            // Get issues from last 24 hours
            const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const recentIssues = await octokit.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: yesterday,
              state: 'all'
            });
            
            // Get pull requests from last 24 hours
            const recentPRs = await octokit.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc'
            });
            
            const today = new Date().toISOString().split('T')[0];
            
            const report = `# 📊 HyperAI Phoenix Daily Contact Report
**Date:** ${today}
**Repository:** https://github.com/${context.repo.owner}/${context.repo.repo}

## 🐙 GitHub Activity (Last 24 hours)
- **⭐ Stars:** ${repo.data.stargazers_count}
- **🍴 Forks:** ${repo.data.forks_count}
- **👀 Watchers:** ${repo.data.watchers_count}
- **📝 New Issues:** ${recentIssues.data.length}
- **🔄 New Pull Requests:** ${recentPRs.data.filter(pr => new Date(pr.created_at) > new Date(yesterday)).length}

## 📈 Engagement Metrics
- **🇻🇳 Vietnamese Community Issues:** ${recentIssues.data.filter(issue => 
  issue.title.toLowerCase().includes('vietnamese') || 
  (issue.body && issue.body.toLowerCase().includes('vietnamese'))
).length}
- **🏢 Enterprise Inquiries:** ${recentIssues.data.filter(issue => 
  issue.title.toLowerCase().includes('enterprise') || 
  (issue.body && issue.body.toLowerCase().includes('enterprise'))
).length}
- **🐛 Bug Reports:** ${recentIssues.data.filter(issue => 
  issue.title.toLowerCase().includes('bug') || 
  (issue.body && issue.body.toLowerCase().includes('bug'))
).length}

## 🎯 Action Items for Tomorrow
- Follow up on unassigned issues: ${recentIssues.data.filter(issue => !issue.assignee).length}
- Review pending pull requests: ${recentPRs.data.filter(pr => pr.state === 'open').length}
- Update Vietnamese community on progress
- Schedule enterprise demos for interested parties

---
**Generated by HyperAI Phoenix Contact Management System** 🤖
**Made with Vietnamese Heart for Global Innovation** 🇻🇳❤️`;

            // Create issue for daily report
            await octokit.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Daily Contact Report - ${today}`,
              body: report,
              labels: ['📊 daily-report', 'internal']
            });

      - name: Weekly Summary
        if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1'
        uses: actions/github-script@v6
        with:
          script: |
            const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const today = new Date().toISOString().split('T')[0];
            
            // Get weekly statistics
            const weeklyIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: weekAgo,
              state: 'all'
            });
            
            const summary = `# 📊 HyperAI Phoenix Weekly Summary
**Week of:** ${today}

## 🚀 Growth Highlights
- **Total Issues This Week:** ${weeklyIssues.data.length}
- **Vietnamese Community Engagement:** ${weeklyIssues.data.filter(issue => 
  issue.title.toLowerCase().includes('vietnamese')).length} issues
- **Enterprise Interest:** ${weeklyIssues.data.filter(issue => 
  issue.title.toLowerCase().includes('enterprise')).length} inquiries

## 🎯 Community Impact
The Vietnamese AI Consciousness project continues to grow globally while maintaining strong Vietnamese cultural roots.

## 📈 Next Week Focus
- Enhance Vietnamese language support
- Expand enterprise documentation
- Grow developer community
- Strengthen cultural AI features

---
**Vietnamese Soul Integration: Maximum Level** 🇻🇳💖`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Summary - ${today}`,
              body: summary,
              labels: ['📊 weekly-summary', 'internal', '🇻🇳 vietnamese-community']
            });
